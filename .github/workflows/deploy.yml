# 수업 서버(Oracle)에 배포: GitHub 저장소 → Actions → "수업 서버 배포" → Run workflow
# 수업 중 갑자기 재시작되지 않도록 push 때 자동으로 돌지 않고 버튼으로만 돈다.
# 필요한 비밀 값: Settings → Secrets and variables → Actions → DEPLOY_KEY (서버 SSH 개인 키 전체 내용)
name: 수업 서버 배포

on:
  workflow_dispatch:

concurrency: deploy-class-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/class-village.key
          chmod 600 ~/.ssh/class-village.key
          ssh-keyscan 161.33.17.35 >> ~/.ssh/known_hosts
      - name: 배포
        run: DEPLOY_KEY=~/.ssh/class-village.key bash tools/deploy.sh
