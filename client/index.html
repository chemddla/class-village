<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#bfe6ff" />
  <title>우리 반 마을</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 상단 정보 -->
  <div id="hud" class="hidden">
    <div class="pill" id="people">접속 0명</div>
    <div class="pill" id="fps">0 FPS</div>
  </div>

  <!-- 조이스틱과 행동 버튼 -->
  <div id="joy-base" class="hidden"><div id="joy-knob"></div></div>
  <button id="action" class="hidden" type="button">👋<span>인사</span></button>
  <div id="hint" class="hidden">왼쪽 화면을 눌러 움직이기 · 방향키/WASD · Shift 달리기 · Space 인사</div>

  <!-- 입장 화면 -->
  <div id="join">
    <form id="join-form" class="card">
      <h1>🌱 우리 반 마을</h1>
      <p class="sub">닉네임과 색을 고르고 마을에 들어가요</p>
      <label for="name">닉네임</label>
      <input id="name" maxlength="10" autocomplete="off" placeholder="예: 별빛토끼" required />
      <label>내 색깔</label>
      <div id="colors"></div>
      <button type="submit" id="join-btn">마을에 들어가기</button>
      <p id="join-error" class="error"></p>
    </form>
  </div>

  <!-- 다시 연결 중 -->
  <div id="reconnect" class="hidden"><div class="card">📶 연결이 끊겼어요. 다시 연결하는 중…</div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
