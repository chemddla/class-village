<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#bfe6ff" />
  <title>우리 반 마을</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 상단 정보 -->
  <div id="hud" class="hidden">
    <div class="pill" id="people">접속 0명</div>
    <div class="pill" id="fps">0 FPS</div>
  </div>

  <!-- 조이스틱과 행동 버튼 -->
  <div id="joy-base" class="hidden"><div id="joy-knob"></div></div>
  <div id="actions" class="hidden">
    <div class="emotes">
      <button type="button" data-key="Digit1">👋<span>1 인사</span></button>
      <button type="button" data-key="Digit2">🎉<span>2 환호</span></button>
      <button type="button" data-key="Digit3">😲<span>3 깜짝</span></button>
      <button type="button" data-key="Digit4">😵<span>4 벌러덩</span></button>
    </div>
    <div class="main-btns">
      <button type="button" id="tool-btn" class="small" data-key="KeyQ"></button>
      <button type="button" id="life-btn" data-key="KeyG"></button>
      <button type="button" id="jump-btn" data-key="Space">⤴️<span>점프</span></button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="hint" class="hidden">방향키/WASD 이동 · Shift 달리기 · Space 점프 · 1~4 감정 표현 · Q 도구 · G 생활 · 마우스 끌기 시점 · 휠 확대</div>

  <!-- 외형 꾸미기 (테스트 서버 전용) -->
  <button id="look-btn" class="hidden" type="button">👕 꾸미기</button>
  <div id="look-panel" class="card hidden"></div>

  <!-- 입장 화면 -->
  <div id="join">
    <form id="join-form" class="card">
      <h1>🌱 우리 반 마을</h1>
      <p class="sub">닉네임과 색을 고르고 마을에 들어가요</p>
      <label for="name">닉네임</label>
      <input id="name" maxlength="10" autocomplete="off" placeholder="예: 별빛토끼" required />
      <label>내 색깔</label>
      <div id="colors"></div>
      <button type="submit" id="join-btn">마을에 들어가기</button>
      <p id="join-error" class="error"></p>
    </form>
  </div>

  <!-- 다시 연결 중 -->
  <div id="reconnect" class="hidden"><div class="card">📶 연결이 끊겼어요. 다시 연결하는 중…</div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
