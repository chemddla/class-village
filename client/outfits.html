<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>기본 옷 시안</title>
  <style>
    :root { --ink: #4a3b2a; --paper: #fffaf0; --on: #7cc46a; }
    html, body { margin: 0; background: var(--paper); font-family: 'Malgun Gothic', system-ui, sans-serif; color: var(--ink); }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 24px 6px; }
    h1 { margin: 0 12px 0 0; font-size: 26px; }
    button { font: inherit; border: none; cursor: pointer; color: var(--ink); border-radius: 999px; padding: 8px 15px;
      font-size: 14px; font-weight: 700; background: #fff; box-shadow: 0 2px 0 rgba(74,59,42,.15); }
    button.on { background: var(--on); color: #fff; }
    #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 14px 24px 28px; }
    .card { position: relative; border-radius: 22px; overflow: hidden; background: #fff;
      box-shadow: 0 6px 18px rgba(74,59,42,.12); }
    .card .view { aspect-ratio: 4 / 5; background: linear-gradient(#bfe3f7, #e6f4fb 65%, #fdf3e2); }
    .card .tag { padding: 10px 14px 12px; min-height: 70px; }
    .card b { display: block; font-size: 17px; }
    .card span { font-size: 13px; opacity: .75; }
    .chips { display: flex; gap: 5px; margin-top: 6px; }
    .chips i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.15); }
    canvas#c { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
    @media (max-width: 900px) { #grid { grid-template-columns: repeat(2, 1fr); padding: 12px 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>기본 옷 시안</h1>
    <button id="front" class="on">앞모습</button>
    <button id="back">뒷모습</button>
    <button id="turn">빙글빙글</button>
  </header>
  <div id="grid"></div>
  <canvas id="c"></canvas>
  <script type="module" src="/src/outfits.js"></script>
</body>
</html>
