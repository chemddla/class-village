<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>구르기 동작 시안</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; color: #4a3525; background: #e6f4fb; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #grid { position: absolute; inset: 0; display: grid; pointer-events: none; }
  .cell { position: relative; border: 1px solid rgba(74,53,37,.12); }
  .cell h2 { position: absolute; left: 10px; top: 8px; margin: 0; font-size: 16px; font-weight: 800;
    background: rgba(255,255,255,.85); border: 2px solid #4a3525; border-radius: 10px; padding: 2px 10px; box-shadow: 0 2px 0 #4a3525; }
  .cell p { position: absolute; left: 12px; top: 42px; right: 12px; margin: 0; font-size: 12.5px; line-height: 1.45; color: #6b5040; }
  .cell .bar { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 6px; border-radius: 3px; background: rgba(74,53,37,.15); overflow: hidden; }
  .cell .bar i { display: block; height: 100%; width: 0; background: #f0a640; }
  #ctl { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: max-content; max-width: 96vw; }
  button { font: inherit; font-size: 14px; font-weight: 700; color: #4a3525; background: #fff8e6; border: 2px solid #4a3525;
    border-radius: 12px; padding: 6px 12px; box-shadow: 0 3px 0 #4a3525; cursor: pointer; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #4a3525; }
  button.on { background: #ffe07a; }
  .scrub { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; background: #fff8e6; border: 2px solid #4a3525;
    border-radius: 12px; padding: 4px 10px; box-shadow: 0 3px 0 #4a3525; white-space: nowrap; }
  .scrub b { min-width: 52px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grid"></div>
<div id="ctl">
  <button data-speed="1" class="on">보통 빠르기</button>
  <button data-speed="0.5">½ 느리게</button>
  <button data-speed="0.2">⅕ 아주 느리게</button>
  <button id="pause">멈춤</button>
  <label class="scrub">멈춰서 보기 <input id="scrub" type="range" min="0" max="100" value="0" /> <b id="scrubVal">재생 중</b></label>
  <button id="play">다시 재생</button>
</div>
<script type="module" src="/src/roll-samples.js"></script>
</body>
</html>
